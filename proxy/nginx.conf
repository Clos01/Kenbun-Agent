user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;
    keepalive_timeout 65;

    # Fallback default tenant UUID if client does not supply x-tenant-id
    map $http_x_tenant_id $tenant_id {
        default $http_x_tenant_id;
        "" "00000000-0000-0000-0000-000000000000";
    }

    # Dynamic Connection header based on Upgrade request
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # SSL Config
    ssl_certificate /etc/nginx/ssl/wildcard.lan.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Specific HTTP -> HTTPS Redirection for subdomains that require TLS
    server {
        listen 80;
        listen [::]:80;
        server_name gitea.lan planka.lan n8n.lan wiki.lan kenbunp330.lan agent.kenbunp330.lan app.kenbunp330.lan sentry.lan pi.lan;
        return 301 https://$host$request_uri;
    }

    # Kenbun Master Dashboard on HTTP (Default Server for port 80)
    # Allows zero-friction mobile/Tailscale access without SSL cert warnings
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name kenbun.lan 100.104.211.61 100.92.127.1 lg2025.tailbe4852.ts.net lg2025 localhost _;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Next.js hot reload / SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # kenbun.lan proxy (Host Master Dashboard on lg2025) - DEFAULT SERVER FOR 443
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name kenbun.lan 100.104.211.61 100.92.127.1 lg2025.tailbe4852.ts.net lg2025 localhost _;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Next.js hot reload / SSE
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # gitea.lan proxy
    server {
        listen 443 ssl;
        server_name gitea.lan;

        location / {
            proxy_pass http://127.0.0.1:3005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # planka.lan proxy
    server {
        listen 443 ssl;
        server_name planka.lan;

        location / {
            proxy_pass http://127.0.0.1:1337;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Planka live updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # n8n.lan proxy
    server {
        listen 443 ssl;
        server_name n8n.lan;

        location / {
            proxy_pass http://127.0.0.1:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for n8n execution stream
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # wiki.lan proxy
    server {
        listen 443 ssl;
        server_name wiki.lan;

        location / {
            proxy_pass http://127.0.0.1:3006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # kenbunp330.lan proxy (P330 Hardware Node :3000)
    server {
        listen 443 ssl;
        server_name kenbunp330.lan;

        location / {
            proxy_pass http://100.100.199.127:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header x-tenant-id $tenant_id;
            
            # WebSocket & SSE streaming support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # agent.kenbunp330.lan / app.kenbunp330.lan proxy (Remote P330 Agent App :3001)
    server {
        listen 443 ssl;
        server_name agent.kenbunp330.lan app.kenbunp330.lan;

        location / {
            proxy_pass http://100.100.199.127:3001;
            proxy_set_header Host 100.100.199.127:3001;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket & SSE streaming support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # sentry.lan proxy (Pi-hole)
    server {
        listen 443 ssl;
        server_name sentry.lan;

        location / {
            proxy_pass http://192.168.1.183;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # pi.lan proxy (Pi-hole alias)
    server {
        listen 443 ssl;
        server_name pi.lan;

        location / {
            proxy_pass http://192.168.1.183;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
