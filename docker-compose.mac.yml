version: '3.8'

services:
  # Telemetry Next.js Dashboard
  dashboard:
    image: node:20-slim
    container_name: dashboard_frontend
    working_dir: /app
    volumes:
      - ${PROJECT_ROOT:-.}/dashboard:/app
      - dashboard_node_modules:/app/node_modules
      - dashboard_next_cache:/app/.next
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_PORT=${API_PORT:-8001}
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - CONFIG_TOKEN=${CONFIG_TOKEN}
    command: sh -c "if [ ! -d /app/node_modules ] || [ ! -f /app/node_modules/.package-lock.json ] || [ /app/package.json -nt /app/node_modules/.package-lock.json ]; then npm install --include=optional && cp /app/package-lock.json /app/node_modules/.package-lock.json; fi && npm run dev"
    restart: unless-stopped

  # Web-Based Database Viewer
  db_viewer:
    image: adminer:latest
    container_name: portable_db_viewer
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  dashboard_node_modules:
  dashboard_next_cache:
