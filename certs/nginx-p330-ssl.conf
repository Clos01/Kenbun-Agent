# ==============================================================================
# 🔒 P330 SSL / TLS REVERSE PROXY CONFIGURATION (Nginx)
# Routes HTTPS traffic for kenbunp330.lan -> :3000 and agent.kenbunp330.lan -> :3001
# ==============================================================================

# 1. Main Dashboard (https://kenbunp330.lan) -> Local Port 3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kenbunp330.lan;

    ssl_certificate /etc/nginx/certs/kenbunp330.lan.pem;
    ssl_certificate_key /etc/nginx/certs/kenbunp330.lan-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Agent / Secondary App (https://agent.kenbunp330.lan or https://kenbunp330.lan:3001) -> Local Port 3001
server {
    listen 443 ssl http2;
    server_name agent.kenbunp330.lan;

    ssl_certificate /etc/nginx/certs/kenbunp330.lan.pem;
    ssl_certificate_key /etc/nginx/certs/kenbunp330.lan-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. Direct Port 3443 (SSL Port 3000 alternative)
server {
    listen 3000 ssl http2;
    server_name kenbunp330.lan 100.100.199.127 localhost;

    ssl_certificate /etc/nginx/certs/kenbunp330.lan.pem;
    ssl_certificate_key /etc/nginx/certs/kenbunp330.lan-key.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 4. HTTP -> HTTPS Auto-Redirect (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name kenbunp330.lan agent.kenbunp330.lan;
    return 301 https://$host$request_uri;
}
