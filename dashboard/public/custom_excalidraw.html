<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenbun Excalidraw Custom</title>
  <script>
    window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
  </script>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.getElementById("root").innerHTML = "<div style='padding: 20px; color: red;'><b>Error:</b> " + msg + "<br/>" + (error ? error.stack : "") + "</div>";
      return false;
    };
    window.addEventListener("unhandledrejection", function(event) {
      document.getElementById("root").innerHTML = "<div style='padding: 20px; color: red;'><b>Unhandled Promise Rejection:</b> " + event.reason + "</div>";
    });
    window.process = { env: { NODE_ENV: 'production' } };
  </script>
</head>
<body>
  <div id="root">
    <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#888;">
      Loading AI Wireframe Canvas...
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.0?deps=react@18.3.1,react-dom@18.3.1"
      }
    }
  </script>
  <script type="module">
    import * as ExcalidrawLib from "@excalidraw/excalidraw";
    import React from "react";
    import ReactDOM from "react-dom/client";

    const { Excalidraw } = ExcalidrawLib;
    
    // Follow the OS/app color-scheme preference so the canvas matches the board's theme.
    const mql = window.matchMedia("(prefers-color-scheme: dark)");

    function WireframeCanvas({ initialData }) {
      const [theme, setTheme] = React.useState(mql.matches ? "dark" : "light");
      React.useEffect(() => {
        const onChange = (e) => setTheme(e.matches ? "dark" : "light");
        mql.addEventListener("change", onChange);
        return () => mql.removeEventListener("change", onChange);
      }, []);
      // keep the page backdrop in sync so the transparent canvas reads correctly
      document.documentElement.style.background = theme === "dark" ? "#121212" : "#ffffff";
      let saveTimeout = null;

      const onChange = (elements, appState) => {
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
          try {
            // await fetch('/api/wireframe', {
            //   method: 'POST',
            //   headers: { 'Content-Type': 'application/json' },
            //   body: JSON.stringify({ elements, appState: { theme: appState.theme, viewBackgroundColor: appState.viewBackgroundColor } })
            // });
            // console.log('Wireframe auto-saved.');
          } catch (err) {
            console.error('Failed to save wireframe:', err);
          }
        }, 2000);
      };

      return React.createElement(Excalidraw, {
        initialData,
        theme,
        name: (initialData && initialData.appState && initialData.appState.name) || "NeverMiss AI",
        onChange,
        UIOptions: {
          canvasActions: {
            changeViewBackgroundColor: true,
            clearCanvas: true,
            loadScene: true,
            saveToActiveFile: true,
            toggleTheme: true,
            saveAsImage: true,
          },
        }
      });
    }

    async function loadApp() {
      // A wireframe belongs to exactly one project. The board passes the selected
      // project through the iframe src (?project_id=...); without it we must NOT
      // fall back to "the" wireframe, because there is no such thing any more —
      // that fallback is how one app ends up showing another app's design.
      const projectId = new URLSearchParams(location.search).get("project_id");
      const root = ReactDOM.createRoot(document.getElementById("root"));

      if (!projectId) {
        root.render(React.createElement("div", {
          style: { padding: "24px", fontFamily: "system-ui, sans-serif", color: "#868e96" }
        }, "Select a project to view its wireframe."));
        return;
      }

      try {
        const response = await fetch('/api/wireframe?project_id=' + encodeURIComponent(projectId));
        const initialData = await response.json();
        root.render(React.createElement(WireframeCanvas, { initialData }));
      } catch (err) {
        console.error("Failed to load wireframe:", err);
        document.getElementById("root").innerHTML = "<div style='padding: 20px; color: red;'>Failed to load canvas data.</div>";
      }
    }

    loadApp();
  </script>
</body>
</html>
