version: '3.8'

services:
  # 1. Standalone Vector Database (ChromaDB)
  chromadb:
    image: chromadb/chroma:latest
    container_name: portable_chroma
    ports:
      - "${BIND_IP:-127.0.0.1}:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma_data
    environment:
      - CHROMA_DB_IMPL=sqlite
      - PERSIST_DIRECTORY=/chroma_data
    restart: unless-stopped

  # 2. Local AI Inference Engine (Ollama)
  ollama_server:
    image: ollama/ollama:latest
    container_name: portable_ollama
    ports:
      - "${BIND_IP:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ${KENBUN_TRAINING_PATH:-./kenbun_training}:/root/kenbun_training
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # 3. Model Initializer (Dynamic Loop & Bypass State)
  ollama_init:
    image: ollama/ollama:latest
    container_name: portable_ollama_init
    depends_on:
      - ollama_server
    environment:
      - OLLAMA_HOST=ollama_server:11434
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-qwen2.5:1.5b}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      if [ \"$$OLLAMA_PULL_MODELS\" != \"none\" ]; then
        for model in $$OLLAMA_PULL_MODELS; do
          echo \"📡 [OLLAMA_INIT] Fetching local model: $$model\";
          ollama pull $$model;
        done;
        echo \"✓ [OLLAMA_INIT] All local models successfully provisioned!\";
      else
        echo \"💡 [OLLAMA_INIT] Cloud-Only or Host-Only profile. Skipping pull.\";
      fi
      "


  # 4. Portable FastMCP Swarm Server
  fastmcp_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portable_fastmcp
    user: root
    ports:
      - "${API_PORT:-8001}:8001"
      - "${MONITOR_PORT:-8002}:8002"
    volumes:
      - ${PROJECT_ROOT:-.}:/app
      - ${BRAIN_HEALTH_PATH:-./brain_health}:/app/brain_health
      - ${KENBUN_TRAINING_PATH:-./kenbun_training}:/app/kenbun_training
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - PROJECT_ROOT=/app
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SWARM_PC_IP=ollama_server
      # PRIMARY_LLM_URL intentionally NOT overridden here — inherit from .env so
      # the container can target a Tailscale / host-side LM Studio endpoint.
      # Set to http://ollama_server:11434/v1 in .env if you want the in-compose
      # Ollama service to be the primary instead.
      - OLLAMA_URL=http://ollama_server:11434/api/generate
    depends_on:
      - chromadb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # 6. Relational Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: portable_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kenbun}
      POSTGRES_DB: ${POSTGRES_DB:-kenbun_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 5. Container Log Viewer (Dozzle)
  dozzle:
    image: amir20/dozzle:latest
    container_name: portable_dozzle
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # 6. Telemetry Next.js Dashboard
  dashboard:
    image: node:20-slim
    container_name: portable_dashboard
    working_dir: /app
    volumes:
      - ${PROJECT_ROOT:-.}/dashboard:/app
      - dashboard_node_modules:/app/node_modules
      - dashboard_next_cache:/app/.next
      - ${BRAIN_HEALTH_PATH:-./brain_health}:/app/brain_health
    ports:
      - "${BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-3080}:3000"
    environment:
      - NEXT_PUBLIC_API_PORT=${API_PORT:-8001}
      - INTERNAL_API_URL=http://fastmcp_server:8001
      - NODE_OPTIONS=--dns-result-order=ipv4first
    command: sh -c "npm install -g pnpm && if [ ! -d /app/node_modules ] || [ ! -f /app/node_modules/.pnpm-lock.yaml ] || [ /app/package.json -nt /app/node_modules/.pnpm-lock.yaml ]; then pnpm install && cp /app/pnpm-lock.yaml /app/node_modules/.pnpm-lock.yaml; fi && pnpm dev"
    depends_on:
      fastmcp_server:
        condition: service_healthy
    restart: unless-stopped

  # 7. Honcho Long-Term Memory API Server
  honcho_api:
    build:
      context: ./external/honcho
      dockerfile: Dockerfile
    container_name: portable_honcho_api
    entrypoint:
      - sh
      - docker/entrypoint.sh
    depends_on:
      honcho_database:
        condition: service_healthy
      honcho_redis:
        condition: service_healthy
      ollama_server:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:8006:8006"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@honcho_database:5432/postgres
      - CACHE_URL=redis://honcho_redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - LLM_OPENAI_API_KEY=dummy
      - LLM_OPENAI_BASE_URL=http://ollama_server:11434/v1
      - DERIVER_MODEL_CONFIG__MODEL=llama3.2:3b
      - SUMMARY_MODEL_CONFIG__MODEL=llama3.2:3b
      - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
      - DREAM_INDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL=qwen3:8b
      - EMBEDDING_MODEL_CONFIG__MODEL=qwen3-embedding:4b
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=http://ollama_server:11434/v1
      - EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE=always
      - PORT=8006
      - EMBED_MESSAGES=false
    restart: unless-stopped

  # 8. Honcho Cognitive Processor (Deriver)
  honcho_deriver:
    build:
      context: ./external/honcho
      dockerfile: Dockerfile
    container_name: portable_honcho_deriver
    entrypoint:
      - /app/.venv/bin/python
      - -m
      - src.deriver
    depends_on:
      honcho_api:
        condition: service_healthy
      honcho_database:
        condition: service_healthy
      honcho_redis:
        condition: service_healthy
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@honcho_database:5432/postgres
      - CACHE_URL=redis://honcho_redis:6379/0?suppress=true
      - CACHE_ENABLED=true
      - LLM_OPENAI_API_KEY=dummy
      - LLM_OPENAI_BASE_URL=http://ollama_server:11434/v1
      - DERIVER_MODEL_CONFIG__MODEL=llama3.2:3b
      - SUMMARY_MODEL_CONFIG__MODEL=llama3.2:3b
      - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
      - DREAM_INDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL=qwen3:8b
      - DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL=qwen3:8b
      - DERIVER_FLUSH_ENABLED=true
      - EMBEDDING_MODEL_CONFIG__MODEL=qwen3-embedding:4b
      - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=http://ollama_server:11434/v1
      - EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE=always
      - EMBED_MESSAGES=false
    restart: unless-stopped

  # 9. Honcho Database (pgvector/pgvector)
  honcho_database:
    image: pgvector/pgvector:pg15
    container_name: portable_honcho_database
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./external/honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - honcho_pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 10. Honcho Redis Cache
  honcho_redis:
    image: redis:8.2
    container_name: portable_honcho_redis
    restart: unless-stopped
    volumes:
      - honcho_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 11. Excalidraw Wireframing Canvas
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: portable_excalidraw
    ports:
      - "${BIND_IP:-127.0.0.1}:${EXCALIDRAW_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
  postgres_data:
  dashboard_node_modules:
  dashboard_next_cache:
  honcho_pgdata:
  honcho_redis_data:
