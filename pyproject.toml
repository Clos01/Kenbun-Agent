[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kenbun-agent"
version = "2.1.0"
description = "Hardware-agnostic standalone containerized Kenbun Agentic Swarm"
readme = "KENBUN.md"
requires-python = ">=3.11"
authors = [
    { name = "Sovereign Swarm Architects", email = "dev@sovereignswarm.org" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.2",
    "requests==2.31.0",
    "chromadb>=0.5.0",
    "psycopg[binary]>=3.1.18",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "mcp==1.28.0",
    "duckduckgo-search==3.8.5",
    "google-genai==0.1.0",
    "scikit-learn==1.3.0",
    "numpy<2.0.0",
    "prompt_toolkit==3.0.0",
    "honcho-ai",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "e2b-code-interpreter",
    "ruff",
    "watchdog>=6.0.0",
    "pypdf>=4.0.0",
]

[project.scripts]
kenbun = "scripts.terminal_chat:main"

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.15.0",
    "sentence-transformers>=2.2.0",
    "tokenizers>=0.13.0",
]
test = [
    "pytest==7.3.0",
    "pytest-asyncio==0.21.0",
    "pytest-mock==3.10.0",
    "autoflake==2.2.0",
    "isort==5.12.0",
    "black==23.9.0",
]

[tool.setuptools]
packages = []

[tool.pyright]
include = ["core", "scripts"]
extraPaths = ["core"]

[tool.pyrefly]
search-path = [".", "core", "scripts", "src"]
disable-search-path-heuristics = true

