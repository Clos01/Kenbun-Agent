# ─────────────────────────────────────────────────────────────────────
# ⚠️  SECURITY: All 'ports:' MUST keep the 127.0.0.1 prefix.
#    Removing it binds to 0.0.0.0 (all interfaces), which:
#      1. Exposes services to the entire LAN / internet
#      2. Shifts the browser origin, breaking CORS authentication
#    Correct:  "127.0.0.1:8001:8001"    Wrong: "8001:8001"
# ─────────────────────────────────────────────────────────────────────
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    environment:
    - TS_AUTHKEY=${TS_AUTHKEY?Required}
    - TS_STATE_DIR=/var/lib/tailscale
    volumes:
    - tailscale_data:/var/lib/tailscale
    cap_add:
    - net_admin
    - net_raw
    networks:
    - default
    - kenbun_planka-tier
    restart: unless-stopped
  chromadb:
    image: chromadb/chroma:latest
    container_name: portable_chroma
    volumes:
    - chroma_data:/chroma_data
    environment:
    - IS_PERSISTENT=TRUE
    - PERSIST_DIRECTORY=/chroma_data
    - ALLOW_RESET=TRUE
    - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    restart: unless-stopped
    network_mode: container:tailscale
    depends_on:
      tailscale:
        condition: service_started
  ollama_server:
    image: ollama/ollama:latest
    container_name: portable_ollama
    volumes:
    - ollama_data:/root/.ollama
    - ${KENBUN_TRAINING_PATH:-./kenbun_training}:/root/kenbun_training
    environment:
    - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
    - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
    - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
    - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    healthcheck:
      test:
      - CMD
      - ollama
      - ps
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    network_mode: container:tailscale
    depends_on:
      tailscale:
        condition: service_started
  ollama_init:
    image: ollama/ollama:latest
    container_name: portable_ollama_init
    depends_on:
      ollama_server:
        condition: service_healthy
      tailscale:
        condition: service_started
    environment:
    - OLLAMA_HOST=localhost:11434
    - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-gemma2:2b deepseek-r1:1.5b}
    entrypoint: "/bin/sh -c \" if [ \\\"$$OLLAMA_PULL_MODELS\\\" != \\\"none\\\" ];\
      \ then\n  for model in $$OLLAMA_PULL_MODELS; do\n    echo \\\"\U0001F4E1 [OLLAMA_INIT]\
      \ Fetching local model: $$model\\\";\n    ollama pull $$model;\n  done;\n  echo\
      \ \\\"\u2713 [OLLAMA_INIT] All local models successfully provisioned!\\\";\n\
      else\n  echo \\\"\U0001F4A1 [OLLAMA_INIT] Cloud-Only or Host-Only profile. Skipping\
      \ pull.\\\";\nfi \"\n"
    network_mode: container:tailscale
  fastmcp_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portable_fastmcp
    user: root
    volumes:
    - ${PROJECT_ROOT:-.}:/app
    - ${BRAIN_HEALTH_PATH:-./brain_health}:/app/brain_health
    - ${KENBUN_TRAINING_PATH:-./kenbun_training}:/app/kenbun_training
    - ~/.config/gcloud:/root/.config/gcloud:ro
    - /var/run/docker.sock:/var/run/docker.sock
    env_file:
    - .env
    environment:
    - PROJECT_ROOT=/app
    - CHROMA_HOST=localhost
    - CHROMA_PORT=8000
    - ASSEMBLY_PC_IP=localhost
    - POSTGRES_HOST=localhost
    # PRIMARY_LLM_URL intentionally NOT overridden here — inherit from .env so
    # it respects the dynamic token governor and Tailscale configs.
    - OLLAMA_URL=http://localhost:11434/api/generate
    - HONCHO_BASE_URL=http://localhost:8006
    - DASHBOARD_PORT=${DASHBOARD_PORT:-3000}
    depends_on:
      chromadb:
        condition: service_started
      ollama_server:
        condition: service_healthy
      tailscale:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8001/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    network_mode: container:tailscale
  dashboard:
    image: node:20-slim
    container_name: portable_dashboard
    working_dir: /app
    volumes:
    - ${PROJECT_ROOT:-.}/dashboard:/app
    - dashboard_node_modules:/app/node_modules
    - dashboard_next_cache:/app/.next
    - ${BRAIN_HEALTH_PATH:-./brain_health}:/app/brain_health
    environment:
    - NEXT_PUBLIC_API_PORT=${API_PORT:-8001}
    - INTERNAL_API_URL=http://localhost:8001
    - NODE_OPTIONS=--dns-result-order=ipv4first
    - TAILSCALE_IP=${TAILSCALE_IP:-100.92.127.1}
    - PC_IP_ADDRESS=${PC_IP_ADDRESS:-100.104.211.61}
    command: sh -c "npm install -g pnpm && if [ ! -d /app/node_modules ] || [ ! -f
      /app/node_modules/.pnpm-lock.yaml ] || [ /app/package.json -nt /app/node_modules/.pnpm-lock.yaml
      ]; then pnpm install && cp /app/pnpm-lock.yaml /app/node_modules/.pnpm-lock.yaml;
      fi && pnpm dev"
    depends_on:
      fastmcp_server:
        condition: service_healthy
      tailscale:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000').then(()=>process.exit(0),()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    network_mode: container:tailscale
  dozzle:
    image: amir20/dozzle:latest
    container_name: portable_dozzle
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    # DOZZLE_ADDR (not `command: --addr`) so the `dozzle healthcheck`
    # subprocess probes the same port the server listens on.
    - DOZZLE_ADDR=:8888
    healthcheck:
      test:
      - CMD
      - /dozzle
      - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    network_mode: container:tailscale
    depends_on:
      tailscale:
        condition: service_started
  honcho_api:
    build:
      context: ./external/honcho
      dockerfile: Dockerfile
    container_name: portable_honcho_api
    entrypoint:
    - sh
    - docker/entrypoint.sh
    depends_on:
      honcho_database:
        condition: service_healthy
      honcho_redis:
        condition: service_healthy
      ollama_server:
        condition: service_healthy
      tailscale:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8006/health',
        timeout=2).read()
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    - CACHE_URL=redis://localhost:6379/0?suppress=true
    - CACHE_ENABLED=true
    - LLM_OPENAI_API_KEY=dummy
    - LLM_OPENAI_BASE_URL=http://localhost:11434/v1
    - DERIVER_MODEL_CONFIG__MODEL=llama3.2:3b
    - SUMMARY_MODEL_CONFIG__MODEL=llama3.2:3b
    - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
    - DREAM_INDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
    - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL=qwen3:8b
    # Embeddings can't ride the LLM_OPENAI_BASE_URL override (the embedding
    # client only reads EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL). The
    # schema's vector columns are 1536-dim, so we use qwen3-embedding:4b
    # (2560 native, MRL) with DIMENSIONS_MODE=always so Ollama truncates to
    # 1536. Keeps embeddings fully local; GEMINI_API_KEY in .env is
    # kenbun-encrypted (enc:) and unusable by Honcho anyway.
    - EMBEDDING_MODEL_CONFIG__MODEL=qwen3-embedding:4b
    - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=http://localhost:11434/v1
    - EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE=always
    - PORT=8006
    - EMBED_MESSAGES=false
    restart: unless-stopped
    network_mode: container:tailscale
  honcho_deriver:
    build:
      context: ./external/honcho
      dockerfile: Dockerfile
    container_name: portable_honcho_deriver
    entrypoint:
    - /app/.venv/bin/python
    - -m
    - src.deriver
    depends_on:
      honcho_api:
        condition: service_healthy
      honcho_database:
        condition: service_healthy
      honcho_redis:
        condition: service_healthy
      tailscale:
        condition: service_started
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    - CACHE_URL=redis://localhost:6379/0?suppress=true
    - CACHE_ENABLED=true
    - LLM_OPENAI_API_KEY=dummy
    - LLM_OPENAI_BASE_URL=http://localhost:11434/v1
    - DERIVER_MODEL_CONFIG__MODEL=llama3.2:3b
    - SUMMARY_MODEL_CONFIG__MODEL=llama3.2:3b
    - DREAM_DEDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
    - DREAM_INDUCTION_MODEL_CONFIG__MODEL=llama3.2:3b
    - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL=qwen3:8b
    - DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL=qwen3:8b
    # Process representation work immediately instead of waiting for a session
    # to accumulate 1024 tokens (REPRESENTATION_BATCH_MAX_TOKENS) — Kenbun's
    # ingests are often small and drip-fed and were queueing forever.
    - DERIVER_FLUSH_ENABLED=true
    # See honcho_api: embeddings are configured separately from the chat
    # transport; conclusion writes embed locally via qwen3-embedding:4b @1536.
    - EMBEDDING_MODEL_CONFIG__MODEL=qwen3-embedding:4b
    - EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL=http://localhost:11434/v1
    - EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE=always
    - EMBED_MESSAGES=false
    restart: unless-stopped
    network_mode: container:tailscale
  honcho_database:
    image: pgvector/pgvector:pg15
    container_name: portable_honcho_database
    restart: unless-stopped
    command:
    - postgres
    - -c
    - max_connections=200
    environment:
    - POSTGRES_DB=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_HOST_AUTH_METHOD=trust
    - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
    - ./external/honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    - honcho_pgdata:/var/lib/postgresql/data/
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: container:tailscale
    depends_on:
      tailscale:
        condition: service_started
  honcho_redis:
    image: redis:8.2
    container_name: portable_honcho_redis
    restart: unless-stopped
    volumes:
    - honcho_redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
    network_mode: container:tailscale
    depends_on:
      tailscale:
        condition: service_started
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: portable_excalidraw
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:80
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    network_mode: container:tailscale
    depends_on:
      tailscale:
        condition: service_started

volumes:
  tailscale_data: null
  chroma_data: null
  ollama_data: null
  dashboard_node_modules: null
  dashboard_next_cache: null
  honcho_pgdata: null
  honcho_redis_data: null

networks:
  default:
    name: kenbun_default
  kenbun_planka-tier:
    external: true
