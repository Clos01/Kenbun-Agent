server {
    listen 80;
    server_name localhost;

    # Increase max upload size for card attachments
    client_max_body_size 100M;

    # Serve the custom CSS file directly
    location /custom.css {
        alias /usr/share/nginx/html/custom.css;
        add_header Content-Type "text/css";
    }

    # Proxy all traffic to the Planka server
    location / {
        proxy_pass http://planka:1337;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSockets support (critical for Planka real-time sync)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Inject custom CSS link into the head of the page on the fly
        sub_filter '</head>' '<link rel="stylesheet" href="/custom.css"></head>';
        sub_filter_once on;
        
        # Disable compression so Nginx can search and replace inside the HTML body
        proxy_set_header Accept-Encoding "";

        # Prevent browser caching of the HTML file to ensure instant style updates
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
