version: '3.8'

services:

  # 📋 Planka (Project Kanban Board - Jira Replacement)
  planka:
    image: ghcr.io/plankanban/planka:latest
    container_name: planka_server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BASE_URL=http://100.104.211.61:1337
      - DATABASE_URL=postgresql://postgres:planka@planka-db:5432/planka
      - SECRET_KEY=${PLANKA_SECRET_KEY}
      - DEFAULT_ADMIN_EMAIL=${PLANKA_DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${PLANKA_DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=Admin
      - DEFAULT_ADMIN_USERNAME=admin
    depends_on:
      - planka-db
    networks:
      - planka-tier
    restart: always

  # 🌐 Nginx UI Customizer & Reverse Proxy Injection
  planka-proxy:
    image: nginx:alpine
    container_name: planka_proxy
    ports:
      - "1337:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./planka-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./planka-custom.css:/usr/share/nginx/html/custom.css:ro
    depends_on:
      - planka
    networks:
      - planka-tier
    restart: always

  planka-db:
    image: postgres:16-alpine
    container_name: planka_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=planka
      - POSTGRES_DB=planka
    volumes:
      - planka_db_data:/var/lib/postgresql/data
    networks:
      - planka-tier
    restart: always

volumes:
  planka_db_data:

networks:
  planka-tier:
    driver: bridge
